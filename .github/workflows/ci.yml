name: CI
permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  ci:
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    strategy:
      matrix:
        os: [ubuntu-26.04, ubuntu-24.04, ubuntu-22.04, ubuntu-26.04-arm, ubuntu-24.04-arm, ubuntu-22.04-arm]
        include:
          - os: ubuntu-latest
            container: ubuntu:26.04
          - os: ubuntu-latest
            container: ubuntu:24.04
          - os: ubuntu-latest
            container: ubuntu:22.04
          - os: ubuntu-latest
            container: ubuntu:20.04
          - os: ubuntu-latest
            container: debian:trixie
          - os: ubuntu-latest
            container: debian:bookworm
      fail-fast: false
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Add a repository
        uses: ./
        with:
          uri: https://apt.repos.intel.com/oneapi
          key: https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB
          suite: all
          architectures: amd64
      - name: Add the same repository again
        uses: ./
        with:
          uri: https://apt.repos.intel.com/oneapi
          key: https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB
          suite: all
          architectures: amd64
      - name: Verify repository configuration
        run: |
          shopt -s nullglob
          sources=(/etc/apt/sources.list.d/add-apt-repository-*.sources)
          test "${#sources[@]}" -eq 1
          file=${sources[0]}
          grep -Fxq 'Types: deb' "$file"
          grep -Fxq 'URIs: https://apt.repos.intel.com/oneapi' "$file"
          grep -Fxq 'Suites: all' "$file"
          grep -Fxq 'Components: main' "$file"
          grep -Fxq 'Architectures: amd64' "$file"
          key=$(sed -n 's/^Signed-By: //p' "$file")
          test -n "$key"
          test -r "$key"
          test ! -e /etc/apt/sources.list.d/add-apt-repository.list
        shell: bash
      - name: Install a package
        if: runner.arch != 'ARM64'
        uses: gerlero/apt-install@v1
        with:
          packages: intel-oneapi-mpi-devel
